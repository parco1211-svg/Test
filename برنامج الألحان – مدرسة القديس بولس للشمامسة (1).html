<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج الألحان – مدرسة القديس بولس للشمامسة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;display=swap">
<style>
:root{--bg:#fbf3e2;--card:#fffaf0;--ink:#17110d;--mute:#5a4a38;--gold:#c9971c;--gl:#f0c14b;--acc:#a8430f;--onacc:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#120d0a;--card:#21170f;--ink:#f6ecd6;--mute:#d6c4a2;--acc:#ff9a5c;--onacc:#17110d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#120d0a;--card:#21170f;--ink:#f6ecd6;--mute:#d6c4a2;--acc:#ff9a5c;--onacc:#17110d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.5}
header{background:#17110d;border-bottom:6px solid var(--gold);padding:20px 16px;display:flex;align-items:center;gap:16px}
header img{width:92px;height:92px;border-radius:50%;background:#fff;flex:none}
.sch{color:#f0c14b;font-weight:600;font-size:14px}
h1{margin:0;color:#fff;font-size:30px;font-weight:800;line-height:1.2}
main{max-width:720px;margin:0 auto;padding:20px 16px 32px}
#yrs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#yrs button{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:var(--card);color:var(--ink);font:800 20px inherit;font-family:inherit;cursor:pointer}
#yrs button[aria-selected="true"]{background:#f0c14b;color:#17110d;border-color:var(--gold)}
h2{color:var(--acc);font-size:26px;font-weight:800;margin:22px 0 10px}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#list button{width:100%;min-height:52px;text-align:right;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;font-family:inherit;font-size:18px;font-weight:600;cursor:pointer}
#list button[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#list i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#17110d;color:#f0c14b;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
#empty{padding:24px;text-align:center;color:var(--mute);border:2px dashed var(--gold);border-radius:14px}
#player{margin-top:16px;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
#pt{font-size:22px;font-weight:800}
audio{width:100%;height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--mute)}
.fld input{width:96px;height:48px;font:600 18px inherit;font-family:inherit;text-align:center;border:2px solid var(--gold);border-radius:10px;background:var(--bg);color:var(--ink)}
.btn{min-height:48px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:600;background:#f0c14b;color:#17110d;border:2px solid #17110d;border-radius:10px;cursor:pointer}
.btn.on{background:var(--acc);color:var(--onacc)}
#st{margin:0;font-size:14px;color:var(--mute);min-height:21px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

const $=id=>document.getElementById(id);
const au=$('au');
let yi=0,hi=0,loop=false;
const fmt=v=>{const n=Math.max(0,Math.floor(Number(v)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
const say=t=>{$('st').textContent=t||''};
function drawYears(){
  const box=$('yrs');box.textContent='';
  YEARS.forEach((y,i)=>{
    const b=document.createElement('button');
    b.type='button';b.textContent=i+1;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(i===yi));b.setAttribute('aria-label',y.n);
    b.onclick=()=>{yi=i;hi=0;show()};
    box.appendChild(b);
  });
}
function drawList(){
  const ul=$('list');ul.textContent='';
  YEARS[yi].h.forEach((h,i)=>{
    const li=document.createElement('li'),b=document.createElement('button'),n=document.createElement('i');
    b.type='button';n.textContent=i+1;
    b.append(n,document.createTextNode(h.t));
    b.setAttribute('aria-current',String(i===hi));
    b.onclick=()=>pick(i);
    li.appendChild(b);ul.appendChild(li);
  });
}
function pick(i){
  hi=i;loop=false;$('lp').textContent='تشغيل التكرار';$('lp').classList.remove('on');
  $('la').value='';$('lb').value='';say('');
  const h=YEARS[yi].h[i];
  $('pt').textContent=h.t;au.src=h.s;au.load();
  drawList();
}
function show(){
  drawYears();
  $('yt').textContent=YEARS[yi].n;
  const has=YEARS[yi].h.length>0;
  $('empty').hidden=has;$('player').hidden=!has;$('list').hidden=!has;
  if(has){pick(hi)}else{au.pause();au.removeAttribute('src');drawList()}
}
const cur=()=>Math.round(au.currentTime);
$('ga').onclick=()=>{$('la').value=cur();say('')};
$('gb').onclick=()=>{$('lb').value=cur();say('')};
$('lp').onclick=()=>{
  if(loop){loop=false;$('lp').textContent='تشغيل التكرار';$('lp').classList.remove('on');say('');return}
  const a=parseFloat($('la').value),b=parseFloat($('lb').value);
  if(!(a>=0)||!(b>a)){say('لازم تكتب البداية والنهاية، والنهاية تكون أكبر من البداية');return}
  loop=true;$('lp').textContent='إيقاف التكرار';$('lp').classList.add('on');
  say('التكرار شغّال: من '+fmt(a)+' لحد '+fmt(b));
  au.currentTime=a;au.play();
};
setInterval(()=>{
  if(!loop)return;
  const a=parseFloat($('la').value),b=parseFloat($('lb').value);
  if(!(b>a))return;
  if(!au.paused&&au.currentTime>=b){au.currentTime=a}
  else if(au.ended){au.currentTime=a;au.play()}
},80);
$('dl').onclick=async()=>{
  const h=YEARS[yi].h[hi];
  try{
    let d=null;
    try{d=window.claude?await window.claude.use('downloads'):null}catch(_){d=null}
    const buf=await (await fetch(h.s)).arrayBuffer();
    if(d){await d.save({filename:h.f,data:buf})}
    else{
      const u=URL.createObjectURL(new Blob([buf],{type:'audio/mp4'}));
      const a=document.createElement('a');a.href=u;a.download=h.f;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000);
    }
    say('تم التحميل');
  }catch(e){say(e&&e.code==='declined'?'':'مقدرتش أحمّل اللحن')}
};
show();
</script>
